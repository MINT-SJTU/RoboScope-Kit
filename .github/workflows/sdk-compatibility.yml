name: SDK compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-build:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine ruff vermin==1.9.1
      - run: python ci/python_support.py check
      - id: matrix
        run: echo "value=$(python ci/python_support.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Check SDK syntax and standard-library baseline
        run: vermin --target=3.11- --violations --no-tips packages/roboscope-kit/src
      - name: Lint
        working-directory: packages/roboscope-kit
        run: |
          python -m ruff check src tests ../../benchmarks/robotwin
          python -m ruff check --target-version py311 ../../ci
      - name: Build release artifacts
        run: bash ci/build-sdk.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-dist
          path: sdk-dist/
          retention-days: 7

  interpreters:
    needs: policy-and-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy-and-build.outputs.matrix) }}
    name: ${{ matrix.support }} Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sdk-dist
          path: sdk-dist/
      - run: bash ci/check-sdk.sh

  compatibility-gate:
    name: SDK compatibility gate
    if: always()
    needs: [policy-and-build, interpreters]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete compatibility matrix
        env:
          POLICY_RESULT: ${{ needs.policy-and-build.result }}
          INTERPRETER_RESULT: ${{ needs.interpreters.result }}
        run: test "$POLICY_RESULT" = success && test "$INTERPRETER_RESULT" = success

  publish-pypi:
    name: Publish SDK to PyPI
    # Publish from main only: every push, plus manual runs to retry a failed release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [compatibility-gate]
    runs-on: ubuntu-24.04
    concurrency:
      group: sdk-pypi-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sdk-dist
          path: sdk-dist/
      - name: Verify downloaded build artifacts
        working-directory: sdk-dist
        run: sha256sum --check SHA256SUMS
      - id: release
        name: Check whether this version is already published
        run: python ci/pypi_release.py plan >> "$GITHUB_OUTPUT"
      - name: Install publisher
        if: steps.release.outputs.publish == 'true'
        run: python -m pip install twine
      - name: Publish the checked wheel and sdist
        if: steps.release.outputs.publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: "1"
        run: |
          test -n "$TWINE_PASSWORD"
          python -m twine upload --repository-url https://upload.pypi.org/legacy/ sdk-dist/*.whl sdk-dist/*.tar.gz
      - name: Verify published artifact hashes
        if: steps.release.outputs.publish == 'true'
        run: python ci/pypi_release.py verify
      - name: Verify installation from official PyPI
        run: bash ci/verify-pypi.sh
