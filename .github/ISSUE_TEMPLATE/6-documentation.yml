name: Documentation
description: Missing, wrong, or unclear documentation.
title: "docs(<scope>): "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Title format: `docs(<scope>): <what to fix>`, in English."
  - type: input
    id: location
    attributes:
      label: Document
      description: File and section, for example `packages/roboscope-kit/README.md#automatic-tuning-kg` or `benchmarks/robotwin/SEED_PROTOCOL.md`.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Quote the current text if it is wrong, and say what actually happens.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
