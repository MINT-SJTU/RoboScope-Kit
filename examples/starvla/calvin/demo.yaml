# CALVIN demo. StarVLA publishes no CALVIN checkpoint; this one is a community StarVLA checkpoint.
benchmark: calvin
suites: [task_D_D]
checkpoint:
  repo: Simplicissimus-S/StarVLA-QwenGR00T_Qwen2.5-VL-3B-Instruct-Action_calvin_D_D
  revision: 962182bdf2cd07958c1fda4a05ea21e8423ab779
starvla_revision: 985c2238627481f25476fbee478083812dd82a21
policy: starvla_policy.py
# Merged into the checkpoint's config.yaml.
config:
  inference:
    dtype: bfloat16
    unnorm_key: franka
    inputs:
      images: [images.static, images.gripper]
      language: language.instruction
    kwargs:
      do_sample: false
      use_ddim: true
      num_ddim_steps: 10
    action_transforms:
      # CALVIN gripper command: 1 = open, -1 = close.
      - operation: threshold
        index: 6
        threshold: 0.0
        below: -1.0
        above: 1.0
